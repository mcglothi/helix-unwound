[project]
name = "helixtune"
version = "0.0.1"
description = "Open engine for Audiotec Fischer HELIX DSP PRO MK2: protocol, emulator, API/MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "javaobj-py3>=0.6.1",
    "mcp>=2.3,<3",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pyserial>=3.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helixtune"]
artifacts = ["src/helixtune/web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
helixtune = "helixtune.cli:main"
